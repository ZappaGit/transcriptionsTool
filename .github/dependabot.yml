# Actualizaciones semanales de dependencias y de acciones de GitHub.
# El ecosistema "uv" actualiza uv.lock a partir de pyproject.toml.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # av 19 eliminó el argumento metadata_errors que usa faster-whisper 1.2.1: no subir a 19 hasta
    # que faster-whisper sea compatible.
    ignore:
      - dependency-name: "av"
        versions: [">=19"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
